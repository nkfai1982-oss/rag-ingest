[project]
name = "rag-ingest"
version = "0.1.0"
description = "Lean, modular multi-tenant RAG Ingestion and Retrieval pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.11.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "python-multipart>=0.0.9",
    "pypdfium2>=4.30.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "python-docx>=1.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
